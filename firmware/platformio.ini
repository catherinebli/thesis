; Teensy 4.1 firmware for the rowing energy-expenditure suit.
;
;   python ../scripts/gen_headers.py        regenerate include/*.h after editing config/pipeline.yaml
;   pio run -e teensy41 -t upload           build and flash (run from this folder)
;   pio device monitor                      serial status at 115200, press q to close the session
;
; Laptop-only checks (no Teensy toolchain needed):
;   make -C test/native replay hal-check
[platformio]
default_envs = teensy41

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
build_unflags = -std=gnu++14
build_flags =
    -std=gnu++17
    -Wall
    -Iinclude
    -Ilib/core
    -Ilib/hal
